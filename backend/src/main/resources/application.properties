# ============================================================
# 🌐 Server Configuration
# ============================================================
# Render automatically provides PORT. Use 8080 locally.
server.port=${PORT:8080}

# ============================================================
# 🗄️ Database Configuration (PostgreSQL on Neon)
# ============================================================
# Works both locally and on Render.
# Set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD in environment vars.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-fragrant-sky-adlplwjk-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_pcCx4zoFgX2t}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# ⚙️ Hibernate / JPA Settings
# ============================================================
# 'update' → auto-creates/updates schema for dev/staging.
# Use 'validate' in production to ensure schema integrity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false                
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# 🔐 JWT Configuration
# ============================================================
# Store JWT_SECRET in environment variables (Render → Environment tab)
jwt.secret=${JWT_SECRET:change-this-to-a-strong-secret-before-deploying}

# ============================================================
# 🪵 Logging Configuration
# ============================================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
# Uncomment below line only for debugging parameter bindings
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================
# ✅ Miscellaneous
# ============================================================
# Disable Open-in-View warning (recommended for REST APIs)
spring.jpa.open-in-view=false