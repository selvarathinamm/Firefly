# ============================================================
# Server
# ============================================================
server.port=${PORT:8080}

# ============================================================
# Database (Postgres)
# ============================================================
# Use SPRING_DATASOURCE_* env vars when available; fall back to DATABASE_* for alternate deploy targets
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/vvfirefly}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# Use environment override for ddl-auto in production; default to update for local/dev
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ============================================================
# Security / App settings
# ============================================================
# JWT secret can be supplied via SPRING_JWT_SECRET environment variable
spring.jwt.secret=${SPRING_JWT_SECRET:}

# ============================================================
# Logging
# ============================================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG