# ============================================================
# 🚀 Render Deployment Blueprint for VVFirefly Backend
# ============================================================

services:
  - type: web
    name: vvfirefly-backend
    env: java
    plan: free                     # change to starter for production stability
    region: singapore              # or the closest region to India
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar

    envVars:
      - key: PORT
        value: 8080

      - key: DATABASE_URL
        sync: false                # will be set manually in Render dashboard

      - key: DATABASE_USERNAME
        sync: false

      - key: DATABASE_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false

    autoDeploy: true               # automatically redeploy on new GitHub pushes

    healthCheckPath: /login        # ensures your backend is alive
