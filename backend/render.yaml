services:
  - type: web
    name: vvfirefly-backend
    env: docker
    region: singapore            
    plan: free                     
    dockerfilePath: ./Dockerfile  
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false

      - key: SPRING_JWT_SECRET
        value: firefly-prod-secret-key

      - key: PORT
        value: 8080
